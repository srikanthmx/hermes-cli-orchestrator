name: cli-orchestrator
version: 0.1.0
author: hermes-cli-governor
description: >-
  Local CLI manager & orchestration matrix. Ships a "CLI Matrix" dashboard tab
  (see dashboard/) plus a post_tool_call hook that tallies how often the agent
  drives each local worker CLI, and a /cli slash command for a quick status read.
provides_tools:
  - cli_delegate
  - generate_music
provides_hooks:
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - api_request_error   # auto-heal: promote a healthy brain when primary is exhausted
  - on_session_start    # restore the preferred primary once its cooldown clears
